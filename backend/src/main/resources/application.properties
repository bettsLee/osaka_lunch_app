spring.application.name=osaka-lunch-backend

# Server
server.port=8080

# Database
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# 10/22 배포가 DB 첫 연결(HikariPool Starting)에서 11분 멈춤 → 연결은 적게(기본 10 → 3, 무료 Supabase 풀러를 예전 서버와 나눠 씀),
# 연결이 안 되면 멈춰 있지 않고 오류를 남기게 (초 단위: 접속 10초 · 로그인 15초 · 쿼리 응답 60초)
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.data-source-properties[connectTimeout]=10
spring.datasource.hikari.data-source-properties[loginTimeout]=15
spring.datasource.hikari.data-source-properties[socketTimeout]=60

# JPA (테이블은 supabase/migrations의 SQL로 만듦. 서버는 스키마를 만들거나 바꾸지 않음)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Supabase 로그인 토큰 확인 (https://프로젝트.supabase.co). 예전 JWT 비밀키를 쓰는 프로젝트만 SUPABASE_JWT_SECRET 설정
supabase.url=${SUPABASE_URL}
supabase.jwt-secret=${SUPABASE_JWT_SECRET:}

# 서버를 부를 수 있는 화면 주소 (운영 · Vercel 미리보기 · 내 컴퓨터)
app.cors.origin-patterns=https://osaka-lunch-app.vercel.app,https://osaka-lunch-app-*-bettslees-projects.vercel.app,http://localhost:3000

# '다녀왔어요?' 알림 (웹 푸시). 키는 Render 환경 변수에만. 비어 있으면 발송만 꺼짐
push.vapid.public-key=${VAPID_PUBLIC_KEY:}
push.vapid.private-key=${VAPID_PRIVATE_KEY:}
push.vapid.subject=${VAPID_SUBJECT:https://osaka-lunch-app.vercel.app}
push.cron-secret=${PUSH_CRON_SECRET:}

# 앱 문구 번역 (처음 보는 휴대폰 언어). 키는 Render 환경 변수에만. 비어 있으면 번역만 꺼짐 (화면은 영어)
# 원문은 운영 화면의 /i18n/ko.json
gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.8-flash}
app.web-origin=${APP_WEB_ORIGIN:https://osaka-lunch-app.vercel.app}

# Logging
logging.level.com.osakalunch=INFO
