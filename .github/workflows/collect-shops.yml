name: Collect Shops

on:
  schedule:
    - cron: '0 19 * * *'   # 매일 04:00 KST (UTC 19:00). main 브랜치에 있어야 돌아감
  workflow_dispatch:       # Actions 탭에서 손으로 실행
    inputs:
      ai_limit:
        description: 'AI로 처리할 최대 가게 수 (0이면 처리할 가게 전부)'
        required: false
        default: '0'

concurrency: collect-shops

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60    # 첫 전체 AI 처리 대비. 평소엔 바뀐 가게만이라 몇 분

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 핫페퍼 점심 가게 수집
        run: python batch/collect.py
        env:
          HOTPEPPER_API_KEY: ${{ secrets.HOTPEPPER_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: AI 구조화 (글이 바뀐 가게만)
        run: python batch/structure_shops.py --max-minutes 45 --workers 32 --limit "$AI_LIMIT"   # 20곳 시험: 8개 동시면 전체 약 3시간 → 32개로 1~2번에 끝냄
        env:
          AI_LIMIT: ${{ inputs.ai_limit || '0' }}   # 매일 예약 실행 때는 0 (전부)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
