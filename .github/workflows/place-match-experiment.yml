name: Place Match Experiment

# 실험 (11/17, OL-63): 핫페퍼 가게에 Overture · OpenStreetMap 세부 종류가 얼마나 붙는지 비교
# 실험 브랜치에 push할 때만 돌고 main에는 머지하지 않음. DB는 읽기만, 출력은 숫자 · 종류 이름만 (공개 저장소)
on:
  push:
    branches: [feature/OL-63-place-match]
    paths:
      - batch/experiments/place_match.py
      - .github/workflows/place-match-experiment.yml

permissions:
  contents: read

jobs:
  match:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 공개 장소 데이터 도구 설치
        run: |
          pip install overturemaps
          sudo apt-get update -q && sudo apt-get install -y -q osmium-tool

      # 공용 Overpass 서버가 502 · 시간 초과라서 간사이 지역 파일을 받아 오사카 음식점만 거름 (© OpenStreetMap contributors)
      - name: OpenStreetMap 간사이 파일에서 오사카 음식점 거르기
        run: |
          curl -fsSL -o kansai.osm.pbf https://download.geofabrik.de/asia/japan/kansai-latest.osm.pbf
          osmium extract -b 135.40,34.57,135.60,34.84 kansai.osm.pbf -o osaka.osm.pbf
          osmium tags-filter osaka.osm.pbf nwr/amenity=restaurant,fast_food,cafe,food_court,pub,bar -o food.osm.pbf
          osmium export food.osm.pbf -f geojsonseq -o food.geojsonseq
          wc -l food.geojsonseq

      - name: 짝 맞추기 비교
        run: python batch/experiments/place_match.py
        env:
          OSM_FILE: food.geojsonseq
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
