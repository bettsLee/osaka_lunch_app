name: Deploy Check

# main에 들어간 커밋이 화면(Vercel) · 서버(Render)에 제대로 배포됐는지 확인. 틀리면 실패 메일 (10/26 결정)
# 10/21 Vercel 서버 주소 설정 오류를 CI가 못 잡았고, 10/25 Render 배포 여부를 바로 확인하지 못했음
on:
  push:
    branches: [main]
  workflow_dispatch:   # Actions 탭에서 지금 main을 손으로 확인

permissions:
  contents: read
  deployments: read

env:
  APP_URL: https://osaka-lunch-app.vercel.app
  API_URL: https://osaka-lunch-api.onrender.com
  API_HOST: osaka-lunch-api.onrender.com
  SHA: ${{ github.sha }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45   # 서버 확인 최대 15분 + 번역 미리 만들기 (원문이 바뀐 날은 10분 기다림)
    steps:
      # 서버 커밋과 이 커밋 사이에 backend 변경이 있는지 보려면 전체 기록이 필요함 (11/14)
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 화면(Vercel) 운영 배포가 이 커밋으로 끝났는지
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 40); do   # 15초씩 최대 10분
            id=$(gh api "repos/${{ github.repository }}/deployments?sha=$SHA&environment=Production" --jq '.[0].id // empty' || true)
            state=""
            if [ -n "$id" ]; then
              state=$(gh api "repos/${{ github.repository }}/deployments/$id/statuses" --jq '.[0].state // empty' || true)
            fi
            echo "Vercel 운영 배포: ${state:-아직 없음}"
            case "$state" in
              success) exit 0 ;;
              failure|error) echo "::error title=화면 배포 실패::Vercel 운영 배포가 $state 예요"; exit 1 ;;
            esac
            sleep 15
          done
          echo "::error title=화면 배포 확인 실패::10분 안에 이 커밋의 Vercel 운영 배포가 끝나지 않았어요"
          exit 1

      - name: 화면이 운영 서버 주소를 쓰는지
        run: |
          curl -fsSL "$APP_URL/" -o page.html
          chunks=$(grep -oE '/_next/static/[^"]+\.js' page.html | sort -u || true)
          for c in $chunks; do
            curl -fsSL "$APP_URL$c" -o chunk.js
            if grep -q "$API_HOST" chunk.js; then
              echo "화면이 $API_HOST 를 불러요 ($c)"
              exit 0
            fi
          done
          echo "::error title=서버 주소::화면 코드에 $API_HOST 가 없어요. Vercel의 NEXT_PUBLIC_API_URL을 확인해 주세요"
          exit 1

      - name: 서버(Render)가 이 커밋으로 떴는지
        run: |
          commit=""
          for i in $(seq 1 30); do   # 30초씩 최대 15분 (Render 배포 3~4분 + 잠든 서버 깨우기)
            commit=$(curl -fsS -m 90 "$API_URL/health" | jq -r '.commit // empty' || true)
            echo "서버 커밋: ${commit:-응답 없음}"
            if [ "$commit" = "$SHA" ]; then
              echo "::notice title=배포 확인::화면 · 서버 모두 ${SHA:0:7}"
              exit 0
            fi
            # Render는 backend/가 바뀐 커밋만 다시 배포함 (11/14 확인: 10/31 · 11/14 화면 · README만 바뀐 날 실패)
            # 서버 커밋과 이 커밋 사이에 backend 변경이 없으면 서버는 이미 최신 코드
            if [ -n "$commit" ] && git cat-file -e "$commit^{commit}" 2>/dev/null \
               && git diff --quiet "$commit" "$SHA" -- backend; then
              echo "::notice title=배포 확인::화면 ${SHA:0:7} · 서버 ${commit:0:7} (그 뒤 backend 변경 없음)"
              exit 0
            fi
            sleep 30
          done
          echo "::error title=서버 배포::15분이 지나도 서버가 ${SHA:0:7} 가 아니에요 (지금 ${commit:-응답 없음}). Render 대시보드 Events를 확인해 주세요"
          exit 1

      # 11/19: 화면 문구(ko.json)가 바뀌면 서버가 언어마다 처음 한 번 Gemini로 번역함 → 그동안 그 언어 사용자는 영어를 봄 (대만 휴대폰)
      # 베타 · 출시 대상 언어는 배포 직후 미리 만들어 둠. 실패해도 배포 실패로 보지 않고 경고만 (번역이 깨졌는지 여기서 알 수 있음)
      - name: 자주 쓰는 언어 번역 미리 만들기
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # 원문이 바뀐 배포면, 서버가 받아 둔 원문(10분 보관)이 새것이 될 때까지 기다림 (예전 원문으로 번역하지 않게)
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null \
             && ! git diff --quiet "$BEFORE" "$SHA" -- frontend/public/i18n/ko.json; then
            echo "원문이 바뀌어서 10분 기다려요"
            sleep 600
          fi
          for lang in ja zh-Hant zh-Hans vi; do
            start=$(date +%s)
            code=$(curl -sS -m 180 -o tr.json -w "%{http_code}" "$API_URL/api/i18n/$lang" || true)
            n=$(jq -r '.messages | length' tr.json 2>/dev/null || echo 0)
            if [ "$code" = "200" ]; then
              echo "::notice title=번역 $lang::${n}줄 ($(( $(date +%s) - start ))초)"
            else
              echo "::warning title=번역 $lang::실패 (HTTP ${code:-응답 없음}). 이 언어 휴대폰은 영어로 보여요"
            fi
          done
